trigger:
- main

pool:
  name: dhurander

stages:
  - stage: 
    jobs:
      - job: 
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'docker-rg'
            command: 'login'
        - task: Docker@2
          inputs:
            containerRegistry: 'docker-rg'
            repository: 'ankitlodhi11/axion-data'
            command: 'buildAndPush'
            Dockerfile: '**/Dockerfile'
