trigger:
- main

pool:
  name: dhurander

stages:

# ============================================================
# STAGE 1 - SECURITY SCAN
# ============================================================
- stage: SecurityScan
  displayName: 'Security Scan'

  jobs:
  - job: SecurityScanJob
    displayName: 'Gitleaks and Checkov'

    steps:

    # ========================================================
    # GITLEAKS
    # ========================================================
    - powershell: |
        Write-Host "=========================================="
        Write-Host "        GITLEAKS SECRET SCAN"
        Write-Host "=========================================="

        $gitleaks = "C:\Program Files\Gitleaks\gitleaks.exe"

        if (-not (Test-Path $gitleaks)) {
            Write-Host "##vso[task.logissue type=warning]Gitleaks executable not found."
            Write-Host "Gitleaks path: $gitleaks"
            exit 0
        }

        & $gitleaks detect `
          --source "$(System.DefaultWorkingDirectory)/infradev" `
          --no-git `
          --redact

        $exitCode = $LASTEXITCODE

        Write-Host "Gitleaks Exit Code: $exitCode"

        if ($exitCode -ne 0) {
            Write-Host "##vso[task.logissue type=warning]Gitleaks detected potential secrets."
            Write-Host "Pipeline will continue."
        }
        else {
            Write-Host "Gitleaks scan completed successfully."
        }

        exit 0
      displayName: 'Gitleaks Secret Scan'


    # ========================================================
    # CHECKOV INSTALL
    # ========================================================
    - powershell: |
        Write-Host "=========================================="
        Write-Host "          INSTALLING CHECKOV"
        Write-Host "=========================================="

        python --version

        python -m pip install checkov

        Write-Host "Checkov version:"
        checkov --version
      displayName: 'Install Checkov'


    # ========================================================
    # CHECKOV TERRAFORM SCAN
    # ========================================================
    - powershell: |
        Write-Host "=========================================="
        Write-Host "       CHECKOV TERRAFORM SECURITY SCAN"
        Write-Host "=========================================="

        $terraformPath = "$(System.DefaultWorkingDirectory)/infradev"

        if (-not (Test-Path $terraformPath)) {
            Write-Host "##vso[task.logissue type=warning]Terraform directory not found."
            Write-Host "Path: $terraformPath"
            exit 0
        }

        checkov `
          -d "$terraformPath" `
          --framework terraform `
          --output cli

        $exitCode = $LASTEXITCODE

        Write-Host "Checkov Exit Code: $exitCode"

        if ($exitCode -ne 0) {
            Write-Host "##vso[task.logissue type=warning]Checkov detected security issues."
            Write-Host "Pipeline will continue."
        }
        else {
            Write-Host "Checkov scan completed successfully."
        }

        exit 0
      displayName: 'Checkov Terraform Security Scan'


    # ========================================================
    # ARCHIVE TERRAFORM
    # ========================================================
    - task: ArchiveFiles@2
      displayName: 'Archive Terraform Files'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/infradev'
        includeRootFolder: true
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/terraform-$(Build.BuildId).zip'
        replaceExistingArchive: true


# ============================================================
# STAGE 2 - SONARCLOUD
# ============================================================
- stage: SonarCloud
  displayName: 'SonarCloud Analysis'

  dependsOn: SecurityScan
  condition: succeeded()

  jobs:
  - job: SonarCloudJob
    displayName: 'SonarCloud Analysis and Quality Gate'

    steps:

    # ========================================================
    # SONARCLOUD PREPARE
    # ========================================================
    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'pipelinetesting'
        organization: 'ankitdec329'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'ankitdec329_ReactTodoUIMonolith.git'
        cliProjectName: 'ReactTodoUIMonolith'
        cliSources: '$(System.DefaultWorkingDirectory)/infradev'


    # ========================================================
    # SONARCLOUD ANALYZE
    # ========================================================
    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Analysis'
      continueOnError: true


    # ========================================================
    # SONARCLOUD QUALITY GATE
    # ========================================================
    - task: SonarCloudPublish@3
      displayName: 'Publish SonarCloud Quality Gate'
      inputs:
        pollingTimeoutSec: '120'
      continueOnError: true


# ============================================================
# STAGE 3 - TERRAFORM
# ============================================================
- stage: Terraform
  displayName: 'Terraform Validate and Plan'

  dependsOn: SonarCloud
  condition: succeeded()

  jobs:
  - job: TerraformJob
    displayName: 'Terraform Init Validate and Plan'

    steps:

    # ========================================================
    # TERRAFORM INSTALL
    # ========================================================
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.9.8'


    # ========================================================
    # TERRAFORM VERSION
    # ========================================================
    - powershell: |
        Write-Host "=========================================="
        Write-Host "          TERRAFORM VERSION"
        Write-Host "=========================================="

        terraform version
      displayName: 'Terraform Version'


    # ========================================================
    # TERRAFORM INIT
    # ========================================================
    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infradev'
        backendServiceArm: 'trvy'
        backendAzureRmStorageAccountName: 'azpipeline123'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'prod.terraform.tfstate'


    # ========================================================
    # TERRAFORM VALIDATE
    # ========================================================
    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infradev'


    # ========================================================
    # TERRAFORM PLAN
    # ========================================================
    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infradev'
         