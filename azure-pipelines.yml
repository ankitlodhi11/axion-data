trigger:
- main

pool:
  name: dhurander

stages:

# ============================================================
# STAGE 1 - SECURITY SCAN
# ============================================================
- stage: SecurityScan
  displayName: 'Security Scan'

  jobs:
  - job: SecurityScanJob
    displayName: 'Gitleaks + Checkov'

    steps:

    # --------------------------------------------------------
    # GITLEAKS
    # --------------------------------------------------------
    - powershell: |
        Write-Host "======================================"
        Write-Host "Running Gitleaks Secret Scan"
        Write-Host "======================================"

        & "C:\Program Files\Gitleaks\gitleaks.exe" detect `
          --source "$(System.DefaultWorkingDirectory)" `
          --no-git `
          --redact

        if ($LASTEXITCODE -ne 0) {
          Write-Host "Gitleaks detected secrets."
          exit 1
        }

        Write-Host "Gitleaks scan completed successfully."
      displayName: 'Gitleaks Secret Scan'


    # --------------------------------------------------------
    # CHECKOV INSTALL
    # --------------------------------------------------------
    - powershell: |
        Write-Host "======================================"
        Write-Host "Installing Checkov"
        Write-Host "======================================"

        python -m pip install --upgrade pip
        python -m pip install checkov

        checkov --version
      displayName: 'Install Checkov'


    # --------------------------------------------------------
    # CHECKOV TERRAFORM SCAN
    # --------------------------------------------------------
    - powershell: |
        Write-Host "======================================"
        Write-Host "Running Checkov Terraform Scan"
        Write-Host "======================================"

        checkov `
          -d "$(System.DefaultWorkingDirectory)/infradev" `
          --framework terraform

        if ($LASTEXITCODE -ne 0) {
          Write-Host "Checkov detected security issues."
          exit 1
        }

        Write-Host "Checkov scan completed successfully."
      displayName: 'Checkov Terraform Security Scan'


# ============================================================
# STAGE 2 - SONARCLOUD
# ============================================================
- stage: SonarCloud
  displayName: 'SonarCloud Analysis'
  dependsOn: SecurityScan
  condition: succeeded()

  jobs:
  - job: SonarCloudJob
    displayName: 'SonarCloud Analysis + Quality Gate'

    steps:

    # --------------------------------------------------------
    # SONARCLOUD PREPARE
    # --------------------------------------------------------
    - task: SonarCloudPrepare@3
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'pipelinetesting'
        organization: 'ankitdec329'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'ankitdec329_ReactTodoUIMonolith.git'
        cliProjectName: 'ReactTodoUIMonolith'
        cliSources: '$(System.DefaultWorkingDirectory)/infradev'


    # --------------------------------------------------------
    # SONARCLOUD ANALYZE
    # --------------------------------------------------------
    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Analysis'


    # --------------------------------------------------------
    # SONARCLOUD QUALITY GATE
    # --------------------------------------------------------
    - task: SonarCloudPublish@3
      displayName: 'Publish SonarCloud Quality Gate'
      inputs:
        pollingTimeoutSec: '300'


# ============================================================
# STAGE 3 - TERRAFORM VALIDATE + PLAN
# ============================================================
- stage: Terraform
  displayName: 'Terraform Validate + Plan'
  dependsOn: SonarCloud
  condition: succeeded()

  jobs:
  - job: TerraformJob
    displayName: 'Terraform Init + Validate + Plan'

    steps:

    # --------------------------------------------------------
    # TERRAFORM INSTALL
    # --------------------------------------------------------
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'


    # --------------------------------------------------------
    # TERRAFORM VERSION
    # --------------------------------------------------------
    - powershell: |
        terraform version
      displayName: 'Terraform Version'


    # --------------------------------------------------------
    # TERRAFORM INIT
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infradev'
        backendServiceArm: 'trvy'
        backendAzureRmStorageAccountName: 'azpipeline123'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'prod.terraform.tfstate'


    # --------------------------------------------------------
    # TERRAFORM VALIDATE
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infradev'


    # --------------------------------------------------------
    # TERRAFORM PLAN
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infradev'
        environmentServiceNameAzureRM: 'trvy'