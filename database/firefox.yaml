apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox     
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefox
  template:
    metadata:
      labels:
        app: firefox
    spec:
      containers:
        - name: firefox
          image: linuxserver/firefox
          ports:
            - containerPort: 3001