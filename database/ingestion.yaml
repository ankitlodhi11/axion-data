apiVersion: apps/v1
kind: Deployment
metadata:
  name: axioningestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axioningestion
  template:
    metadata:
      labels:
        app: axioningestion
    spec:
      containers:
        - name: ingestioncontainer
          image: axion912345.azurecr.io/ingestion:v1
          ports:
            - containerPort: 8000
          