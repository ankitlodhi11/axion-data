trigger:
  - main

pool:
  name: dhurander

variables:
  azureServiceConnection: 'axion'
  acrName: 'axion912345'
  acrLoginServer: 'axion912345.azurecr.io'
  resourceGroupName: 'rg-aks-axion'
  aksClusterName: 'aks-axion-03'
  imageTag: '$(Build.BuildId)'

stages:
# ------------------------------------------------------------------
# Stage 1: Setup Database & pgAdmin on AKS
# ------------------------------------------------------------------
- stage: SetupDatabase
  displayName: 'Deploy Postgres & pgAdmin'
  jobs:
  - job: DeployDB
    displayName: 'Deploy Database Infrastructure'
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: 'Connect AKS & Deploy Postgres + pgAdmin'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Connecting to AKS..."
          az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing

          Write-Host "Deploying Postgres Database..."
          kubectl apply -f $(System.DefaultWorkingDirectory)/database/postgres.yaml

          Write-Host "Deploying pgAdmin..."
          kubectl apply -f $(System.DefaultWorkingDirectory)/database/pgadmin.yaml

# ------------------------------------------------------------------
# Stage 2: Parallel Docker Build & Push (Ingestion, Simulator, UI)
# ------------------------------------------------------------------
- stage: BuildAndPush
  displayName: 'Parallel Docker Build & Push'
  dependsOn: [] # Database setup ke parallel chalne ke liye
  jobs:
  - job: BuildMicroservices
    displayName: 'Build & Push Images'
    strategy:
      maxParallel: 3
      matrix:
        Ingestion:
          serviceName: 'axion-ingestion-service'
          folderPath: 'axion-ingestion-service'
        Simulator:
          serviceName: 'axion-data-simulator'
          folderPath: 'axion-data-simulator'
        UI:
          serviceName: 'axion-ui'
          folderPath: 'axion-ui'
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: 'Login to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)

    - powershell: |
        docker build -t $(acrLoginServer)/$(serviceName):$(imageTag) -f $(System.DefaultWorkingDirectory)/$(folderPath)/Dockerfile $(System.DefaultWorkingDirectory)/$(folderPath)
        docker push $(acrLoginServer)/$(serviceName):$(imageTag)
      displayName: 'Build & Push $(serviceName)'

# ------------------------------------------------------------------
# Stage 3: Deploy Microservices to AKS
# ------------------------------------------------------------------
- stage: DeployToAKS
  displayName: 'Deploy Services to AKS'
  dependsOn:
    - SetupDatabase
    - BuildAndPush
  condition: succeeded()
  jobs:
  - deployment: K8sDeployment
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Connect AKS & Deploy Microservices'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # 1. Connect to AKS
                az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing

                # 2. Update Image tags for built services
                Get-ChildItem "$(System.DefaultWorkingDirectory)/database/*.yaml" | ForEach-Object {
                    (Get-Content $_.FullName) `
                    -replace 'image:\s*.*axion-ingestion.*', "image: $(acrLoginServer)/axion-ingestion-service:$(imageTag)" `
                    -replace 'image:\s*.*axion-data-simulator.*', "image: $(acrLoginServer)/axion-data-simulator:$(imageTag)" `
                    -replace 'image:\s*.*axion-ui.*', "image: $(acrLoginServer)/axion-ui:$(imageTag)" |
                    Set-Content $_.FullName
                }

                # 3. Deploy Application Services
                Write-Host "Deploying Ingestion Service..."
                kubectl apply -f $(System.DefaultWorkingDirectory)/database/axion-ingestion-service.yaml

                Write-Host "Deploying Data Simulator..."
                kubectl apply -f $(System.DefaultWorkingDirectory)/database/axion-data-simulator.yaml

                Write-Host "Deploying Axion UI..."
                kubectl apply -f $(System.DefaultWorkingDirectory)/database/axion-ui.yaml