trigger:
  - main

pool:
  name: dhurander

variables:
  azureServiceConnection: 'axion'
  acrName: 'axion912345'
  acrLoginServer: 'axion912345.azurecr.io'
  resourceGroupName: 'rg-aks-axion'
  aksClusterName: 'aks-axion-03'
  imageTag: '$(Build.BuildId)'

stages:
# ------------------------------------------------------------------
# Stage 1: Security Scans (Secret Detection & IaC)
# ------------------------------------------------------------------
- stage: SecurityScans
  displayName: 'DevSecOps: Secrets & IaC'
  jobs:
  - job: CodeSecurity
    displayName: 'Gitleaks & Checkov'
    steps:
    # 1. Secret Detection (Gitleaks)
    - script: |
        wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
        tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
        sudo mv gitleaks /usr/local/bin/
        gitleaks detect --source . --verbose
      displayName: 'Run Gitleaks Secret Scan'

    # 2. Checkov IaC Security
    - script: |
        pip install --upgrade checkov
        checkov -d $(System.DefaultWorkingDirectory)/infradev --framework terraform --soft-fail
        checkov -d $(System.DefaultWorkingDirectory)/database --framework kubernetes --soft-fail
      displayName: 'Run Checkov IaC Scan'

# ------------------------------------------------------------------
# Stage 2: Parallel Docker Build, Trivy Scan & ACR Push
# ------------------------------------------------------------------
- stage: BuildScanAndPush
  displayName: 'Parallel Docker Build & Trivy Scan'
  dependsOn: SecurityScans
  condition: succeeded()
  jobs:
  - job: BuildMicroservices
    displayName: 'Build & Scan'
    strategy:
      parallel: 4
      matrix:
        Ingestion:
          serviceName: 'axion-ingestion-service'
          folderPath: 'axion-ingestion-service'
        Telemetry:
          serviceName: 'axion-telemetry-query-service'
          folderPath: 'axion-telemetry-query-service'
        Simulator:
          serviceName: 'axion-data-simulator'
          folderPath: 'axion-data-simulator'
        UI:
          serviceName: 'axion-ui'
          folderPath: 'axion-ui'
    steps:
    - script: |
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy -y
      displayName: 'Install Trivy Scanner'

    - task: AzureCLI@2
      displayName: 'Login to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)

    - script: |
        docker build -t $(acrLoginServer)/$(serviceName):$(imageTag) -f $(System.DefaultWorkingDirectory)/$(folderPath)/Dockerfile $(System.DefaultWorkingDirectory)/$(folderPath)
        trivy image --severity HIGH,CRITICAL --exit-code 0 $(acrLoginServer)/$(serviceName):$(imageTag)
        docker push $(acrLoginServer)/$(serviceName):$(imageTag)
      displayName: 'Build, Scan & Push $(serviceName)'

# ------------------------------------------------------------------
# Stage 3: Deploy Manifests to AKS (CD)
# ------------------------------------------------------------------
- stage: DeployToAKS
  displayName: 'Deploy App to AKS'
  dependsOn: BuildScanAndPush
  condition: succeeded()
  jobs:
  - deployment: K8sDeployment
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Connect to AKS and Deploy'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing

                sed -i 's|image:.*axion-ingestion.*|image: $(acrLoginServer)/axion-ingestion-service:$(imageTag)|g' $(System.DefaultWorkingDirectory)/database/*.yaml
                sed -i 's|image:.*axion-telemetry.*|image: $(acrLoginServer)/axion-telemetry-query-service:$(imageTag)|g' $(System.DefaultWorkingDirectory)/database/*.yaml
                sed -i 's|image:.*axion-data-simulator.*|image: $(acrLoginServer)/axion-data-simulator:$(imageTag)|g' $(System.DefaultWorkingDirectory)/database/*.yaml
                sed -i 's|image:.*axion-ui.*|image: $(acrLoginServer)/axion-ui:$(imageTag)|g' $(System.DefaultWorkingDirectory)/database/*.yaml

                kubectl apply -f $(System.DefaultWorkingDirectory)/database/